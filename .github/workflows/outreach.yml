name: Outreach Automation
on:
  push:
    paths:
      - leads.csv
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run outreach script
        run: python outreach.py